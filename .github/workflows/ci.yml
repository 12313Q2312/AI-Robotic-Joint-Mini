name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check repository contents
        run: python scripts/check_repository.py
      - name: Knee stair L1 fault injection
        run: python -m unittest tests.test_knee_stair_l1_faults -v
      - name: Knee stair L1 metrics reproduction
        run: python scripts/run_knee_stair_l1_metrics.py --check
      - name: Run offline Python, C++ and frontend verification
        run: python scripts/verify_joint_study.py --output data/verification/ci-check.json
      - name: Summarize verification
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('data/verification/ci-check.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Offline software verification\n\n')
              if p.exists():
                  r = json.loads(p.read_text(encoding='utf-8'))
                  f.write('| Check | Status |\n|---|---|\n')
                  for c in r['checks']:
                      f.write(f"| {c['name']} | {c['status']} |\n")
                  f.write('\nScope: synthetic software checks; no ROS 2 build, Webots motion, hardware or walking validation.\n')
              else:
                  f.write('Verification report unavailable; inspect failed steps.\n')
          PY

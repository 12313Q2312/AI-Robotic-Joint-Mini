name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check repository contents
        run: python scripts/check_repository.py
      - name: Knee stair L1 fault injection
        run: python -m unittest tests.test_knee_stair_l1_faults tests.test_knee_stair_l2_freshness tests.test_knee_stair_l2_stamp -v
      - name: Knee stair L1 metrics reproduction
        run: python scripts/run_knee_stair_l1_metrics.py --check --raw-dir "$RUNNER_TEMP/knee-stair-l1-raw"
      - name: Upload knee stair raw metrics
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 Node.js 24
        with:
          name: knee-stair-l2-metrics-raw
          path: ${{ runner.temp }}/knee-stair-l1-raw/metrics_raw.json
          if-no-files-found: error
      - name: Knee stair L1 latency and sensitivity sweeps
        run: python scripts/run_knee_stair_l1_sweeps.py --check
      - name: Actuator torque C++ clamp tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -I knee_stair_l1/include tests/actuator_torque_test.cpp -o "$RUNNER_TEMP/actuator_torque_test"
          "$RUNNER_TEMP/actuator_torque_test"
      - name: Run offline Python, C++ and frontend verification
        run: python scripts/verify_joint_study.py --output data/verification/ci-check.json
      - name: RJ-INT-01 offline acceptance and source syntax
        run: |
          python -m unittest tests.test_rj_int_01_assess -v
          python -m py_compile scripts/rj_int_01_assess.py ros2_ws/src/ai_robotic_joint_ros2/launch/joint_native_launch.py ros2_ws/src/ai_robotic_joint_ros2/scripts/rj_int_01_smoke.py
      - name: RJ-INT-01 C++ configured actuator gate
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -I knee_stair_l1/include tests/actuator_config_path_test.cpp -o "$RUNNER_TEMP/actuator_config_path_test"
          "$RUNNER_TEMP/actuator_config_path_test"
      - name: Summarize verification
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('data/verification/ci-check.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Offline software verification\n\n')
              if p.exists():
                  r = json.loads(p.read_text(encoding='utf-8'))
                  f.write('| Check | Status |\n|---|---|\n')
                  for c in r['checks']:
                      f.write(f"| {c['name']} | {c['status']} |\n")
                  f.write('\nScope: synthetic software checks; no ROS 2 build, Webots motion, hardware or walking validation.\n')
              else:
                  f.write('Verification report unavailable; inspect failed steps.\n')
          PY

  ros2-build:
    name: ros2-build-jazzy
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ROS 2 integration dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            ros-jazzy-webots-ros2-driver \
            ros-jazzy-rosidl-default-generators \
            ros-jazzy-pluginlib
      - name: Build ROS 2 package and run CTest
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --packages-select ai_robotic_joint_ros2 --event-handlers console_direct+
          source install/setup.bash
          colcon test --packages-select ai_robotic_joint_ros2 --event-handlers console_direct+
          colcon test-result --verbose
      - name: Install Webots R2025a and headless display
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl xvfb xauth
          curl --fail --location --retry 3 \
            --output /tmp/webots_2025a_amd64.deb \
            https://github.com/cyberbotics/webots/releases/download/R2025a/webots_2025a_amd64.deb
          # Webots R2025a, exact asset webots_2025a_amd64.deb (162910802 bytes).
          echo "6253d58c9b625a83ed7b62cd85a640fd0542d441c48d633a60932208b40b0657  /tmp/webots_2025a_amd64.deb" | sha256sum --check
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends /tmp/webots_2025a_amd64.deb
          test -x /usr/local/webots/webots
      - name: RJ-INT-01 live Webots joint movement and timeout smoke
        shell: bash
        env:
          WEBOTS_HOME: /usr/local/webots
          RJ_WEBOTS_HEADLESS: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          QTWEBENGINE_DISABLE_SANDBOX: '1'
        run: |
          set -eo pipefail
          mkdir -p local
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            set -eo pipefail
            source /opt/ros/jazzy/setup.bash
            source ros2_ws/install/setup.bash
            ros2 launch ai_robotic_joint_ros2 joint_native_launch.py > local/webots-launch.log 2>&1 &
            launch_pid=$!
            trap "kill $launch_pid 2>/dev/null || true" EXIT
            timeout 90s ros2 run ai_robotic_joint_ros2 rj_int_01_smoke.py \
              --startup-seconds 50 --move-seconds 8 --timeout-seconds 2.2 \
              --output local/rj_int_01_smoke.json
          '
      - name: Print Webots launch diagnostics
        if: always()
        run: |
          echo "===== Webots and ROS launch diagnostics ====="
          if test -f local/webots-launch.log; then
            echo "===== STARTUP ====="; head -n 100 local/webots-launch.log
            echo "===== ERROR MARKERS ====="; grep -E -i "traceback|exception|error|failed|joint_safety|not found|import" local/webots-launch.log | head -n 120 || true
            echo "===== END ====="; tail -n 30 local/webots-launch.log
          fi
      - name: Upload Webots integration evidence (even if failed)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rj-int-01-webots-evidence
          path: |
            local/rj_int_01_smoke.json
            local/webots-launch.log
          if-no-files-found: warn
      - name: State exact test scope
        if: always()
        run: echo "ROS 2 build + CTest and headless Webots smoke are separate steps; only the live smoke PASS and uploaded evidence support simulation-motion claims. No hardware or knee-assistance validation." >> "$GITHUB_STEP_SUMMARY"

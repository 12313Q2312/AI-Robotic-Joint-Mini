name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check repository contents
        run: python scripts/check_repository.py
      - name: Knee stair L1 fault injection
        run: python -m unittest tests.test_knee_stair_l1_faults tests.test_knee_stair_l2_freshness tests.test_knee_stair_l2_stamp -v
      - name: Knee stair L1 metrics reproduction
        run: python scripts/run_knee_stair_l1_metrics.py --check --raw-dir "$RUNNER_TEMP/knee-stair-l1-raw"
      - name: Upload knee stair raw metrics
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 Node.js 24
        with:
          name: knee-stair-l2-metrics-raw
          path: ${{ runner.temp }}/knee-stair-l1-raw/metrics_raw.json
          if-no-files-found: error
      - name: Knee stair L1 latency and sensitivity sweeps
        run: python scripts/run_knee_stair_l1_sweeps.py --check
      - name: Actuator torque C++ clamp tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -I knee_stair_l1/include tests/actuator_torque_test.cpp -o "$RUNNER_TEMP/actuator_torque_test"
          "$RUNNER_TEMP/actuator_torque_test"
      - name: Run offline Python, C++ and frontend verification
        run: python scripts/verify_joint_study.py --output data/verification/ci-check.json
      - name: Summarize verification
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('data/verification/ci-check.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Offline software verification\n\n')
              if p.exists():
                  r = json.loads(p.read_text(encoding='utf-8'))
                  f.write('| Check | Status |\n|---|---|\n')
                  for c in r['checks']:
                      f.write(f"| {c['name']} | {c['status']} |\n")
                  f.write('\nScope: synthetic software checks; no ROS 2 build, Webots motion, hardware or walking validation.\n')
              else:
                  f.write('Verification report unavailable; inspect failed steps.\n')
          PY
